<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>JMR múltiplos · Valoración por múltiplos</title>
<meta name="description" content="JMR múltiplos: valoración relativa sin DCF, complemento de la valoración principal V2.0. Solo a solicitud expresa.">
<style>
:root{color-scheme:light;--bg:#f6f8fa;--surface:#fff;--ink:#183045;--ink-light:#526679;--border:#dfe6ed;--teal:#0a746d;--s2:#f1f6f7;--warn:#8a5f20;--bar:#7fb6b0}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#091421;--surface:#101f2e;--ink:#ecf5fa;--ink-light:#afc0cc;--border:#344759;--teal:#64c9bf;--s2:#1b2d3d;--warn:#e0b569;--bar:#2f6f69}}
*{box-sizing:border-box}html{font-size:15px}body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.55 ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
a{color:var(--teal)}button{font:inherit;cursor:pointer}
.appnav{background:var(--surface);border-bottom:1px solid var(--border);display:flex;gap:14px;padding:12px max(16px,calc((100vw - 1380px)/2));align-items:center;flex-wrap:wrap}
.appnav a{padding:6px 10px;text-decoration:none;color:var(--ink);border-radius:8px;font-size:.88rem;font-weight:650}.appnav a[aria-current]{background:var(--s2);color:var(--teal)}
.shell{max-width:1380px;margin:auto;padding:20px 16px 56px}
.hero{padding:clamp(24px,4vw,48px);border-radius:18px;background:linear-gradient(118deg,#173850,#235965 58%,#297e75);color:#fff}.hero h1{margin:0 0 6px;font:normal clamp(26px,4vw,40px) Georgia,serif}.hero p{margin:0;max-width:760px;opacity:.92}
.tabs{display:flex;gap:9px;margin:20px 0}.tabs button{background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:9px;padding:9px 14px;font-weight:700;font-size:.85rem}.tabs button[aria-pressed="true"]{background:var(--s2);color:var(--teal);border-color:var(--teal)}
#catalogo{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:13px;padding:15px}.card:hover{border-color:var(--teal)}.card small{color:var(--ink-light)}
.empty{grid-column:1/-1;padding:44px 20px;border:1px dashed var(--border);border-radius:16px;background:var(--surface);text-align:center}
.company-head h2{font:normal clamp(24px,3vw,34px) Georgia,serif;margin:6px 0}.company-head small{color:var(--ink-light);font-size:.55em}
.state{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.04em;padding:3px 10px;border-radius:999px;background:var(--s2);border:1px solid var(--border)}.state[data-estado="BLOQUEADO"]{color:#c45b5b}.state[data-estado="EN_PROCESO"]{color:var(--warn)}
.aviso{background:var(--s2);border:1px solid var(--border);border-left:4px solid var(--warn);border-radius:10px;padding:12px 15px;font-size:.88rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:18px 0}.kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;flex-direction:column}.kpi span{font-size:.8rem;color:var(--ink-light)}.kpi strong{font-size:1.5rem}.kpi small{color:var(--ink-light);font-size:.76rem}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 20px;margin-bottom:18px}.panel h3{margin:0 0 12px;font:600 1.2rem Georgia,serif}
.table-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:10px;margin-bottom:12px}table{border-collapse:collapse;width:100%;min-width:560px;font-variant-numeric:tabular-nums;font-size:.8rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}th:first-child,td:first-child,th[scope=row]{text-align:left}thead th{background:var(--s2);text-align:center}tr.total th,tr.total td{font-weight:800;background:var(--s2)}td.centro{background:var(--s2);font-weight:800}
.nota{color:var(--ink-light);font-size:.84rem}.ctl{padding-left:20px}.ctl li[data-nivel="bloqueo"]{color:#c45b5b}.ctl li[data-nivel="error"]{color:var(--warn)}
.ff-row{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:10px;margin:7px 0;font-size:.82rem}.ff-track{position:relative;height:18px;background:var(--s2);border-radius:9px}
.ff-bar{position:absolute;top:3px;height:12px;background:var(--bar);border-radius:6px}.ff-base{position:absolute;top:0;width:3px;height:18px;background:var(--teal);transform:translateX(-1px)}.ff-price{position:absolute;top:-2px;width:2px;height:22px;background:#c45b5b}
details{margin:8px 0}summary{cursor:pointer;font-weight:700}
@media print{.appnav,.tabs,#catalogo{display:none}body{background:#fff}}
</style>
</head>
<body>
<nav class="appnav" aria-label="Navegación JMR"><a href="jmr-multiplos.html" aria-current="page">JMR múltiplos</a><a href="jmr-v2.html">JMR V2.0</a><a href="expediente.html?seccion=analisis">Floyd</a></nav>
<main class="shell">
  <section class="hero"><h1>JMR múltiplos</h1><p>Valoración relativa por múltiplos (EV/EBITDA, EV/FCFF, P/E, P/FCFE, P/OCF y afines) sobre los estados financieros, márgenes y comparables. Complemento de la valoración principal V2.0, sin DCF y sin promediarse con él. Se elabora solo a solicitud expresa.</p></section>
  <div class="tabs" role="group" aria-label="Vista"><button data-vista="pendientes" aria-pressed="true">Pendientes de mi revisión</button><button data-vista="aprobadas" aria-pressed="false">Aprobadas por mí</button></div>
  <div id="catalogo"></div>
  <div id="detalle"></div>
</main>
<script type="module" src="multiplos/app.mjs"></script>
</body>
</html>
