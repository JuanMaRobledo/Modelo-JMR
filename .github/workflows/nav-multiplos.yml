name: Navegación única y fuente de múltiplos
on:
  pull_request:
    paths:
      - 'docs/mercado.js'
      - 'docs/jmr-theme.css'
      - 'docs/auditorias.html'
      - 'docs/auditoria-integral.html'
      - 'docs/auditoria-multiplos.html'
      - 'docs/historicos.html'
      - 'docs/model-sync.js'
      - 'docs/editor-hoja.*'
      - 'docs/expediente.js'
      - 'docs/jmr-sheet-presentation.js'
      - 'tests/hojas-doble-modo.test.mjs'
      - 'api/model.js'
      - 'lib/model-sheet.js'
      - 'tests/mercado.test.js'
      - 'tests/model-sync.test.mjs'
      - 'tests/editor-hoja.test.mjs'
      - 'tests/expediente.test.mjs'
      - '.github/workflows/nav-multiplos.yml'
  push:
    branches: [main]
jobs:
  navigation-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check docs/mercado.js
      - run: node --check docs/model-sync.js
      - run: node --check docs/expediente.js
      - run: node --check docs/editor-hoja.js
      - run: node --check docs/jmr-sheet-presentation.js
      - run: node --test tests/mercado.test.js tests/expediente.test.mjs tests/editor-hoja.test.mjs tests/hojas-doble-modo.test.mjs tests/model-sync.test.mjs
