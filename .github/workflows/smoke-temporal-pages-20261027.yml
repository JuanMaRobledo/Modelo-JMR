name: Smoke temporal de GitHub Pages JMR
on:
  push:
    branches: ["verify/pages-jmr-20261027"]
    paths:
      - ".github/workflows/smoke-temporal-pages-20261027.yml"
permissions:
  contents: read
jobs:
  comprobar:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verificar acceso publico, contenido del deploy y cabeceras
        run: |
          python - <<'PY'
          import urllib.request
          import sys
          base = "https://juanmarobledo.github.io/Modelo-JMR/"
          pruebas = {
              "visor.html": ["Precio del corte de valoración", "renderPriceCompare(currentPrecioAnalisis, null)"],
              "research.js": ["Precio del corte de valoración"],
              "mi-bitacora.html": ["typeof v.precio === 'number' ? v.precio : v.precioAnalisis"],
          }
          ok = True
          for path, fragments in pruebas.items():
              url = base + path
              try:
                  req = urllib.request.Request(url, headers={"User-Agent":"JMR-pages-smoke/1.0","Cache-Control":"no-cache"})
                  with urllib.request.urlopen(req, timeout=18) as r:
                      raw = r.read().decode("utf-8")
                      print(path, "HTTP", r.status, "bytes", len(raw), "final", r.url)
                  faltantes = [fragment for fragment in fragments if fragment not in raw]
                  if faltantes:
                      ok = False
                      print("FALTAN CAMBIOS", path, faltantes)
                  else:
                      print("OK DEPLOY", path)
              except Exception as exc:
                  ok = False
                  print("NO ACCESIBLE", path, type(exc).__name__, str(exc)[:300])
          if not ok:
              sys.exit(1)
          PY
      - name: Preparar Chromium de prueba
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Probar renderizado real en navegador para escritorio y movil
        run: |
          python - <<'PY'
          import asyncio
          from playwright.async_api import async_playwright
          URL = "https://juanmarobledo.github.io/Modelo-JMR/"
          pages = ["visor.html", "research.html?ticker=ADBE", "mi-bitacora.html"]
          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  for width,height in [(1365,900),(390,844)]:
                      page = await browser.new_page(viewport={"width":width,"height":height})
                      for path in pages:
                          resp=await page.goto(URL+path,wait_until="domcontentloaded",timeout=30000)
                          await page.wait_for_timeout(1500)
                          facts=await page.evaluate("""() => ({text:document.body?.innerText?.length||0, visible:!!document.body&&getComputedStyle(document.body).display!=='none', width:document.documentElement.scrollWidth, viewport:innerWidth, title:document.title, nodes:document.querySelectorAll('button, input, select, textarea').length})""")
                          shot=await page.screenshot(full_page=False)
                          assert resp and resp.status==200, (path, resp.status if resp else "sin respuesta")
                          assert facts["visible"] and facts["text"]>20, (path,facts)
                          assert len(shot)>6000, (path,"captura vacía")
                          print("RENDER_OK",width,path,"bytesPNG",len(shot),"texto",facts["text"],"ancho",facts["width"],"viewport",facts["viewport"],"controles",facts["nodes"])
                      await page.close()
                  await browser.close()
          asyncio.run(main())
          PY
