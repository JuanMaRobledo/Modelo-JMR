# Vuelve a correr el Screener completo (fundamentales de los 10-K de la SEC
# + historia de precios) y publica docs/screener/resultados.json. Los precios
# del día los agrega la propia página al abrirse (api/quotes.js); esto
# mantiene al día lo que cambia más lento: nuevos 10-K, ROIC, márgenes,
# medianas históricas de los múltiplos y la lista del S&P 500.
#
# Corre de lunes a viernes después del cierre de Nueva York, y a mano desde
# la pestaña Actions -> "Screener diario" -> "Run workflow" (ahí se puede
# elegir otro universo: sp500, sp400, sp600 o sp1500 combinado).
name: Screener diario

on:
  schedule:
    - cron: "37 22 * * 1-5"
  workflow_dispatch:
    inputs:
      universe:
        description: "Universo (sp500, sp400, sp600 o sp1500 combinado)"
        default: "sp1500"
        required: true

permissions:
  contents: write

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  screener:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # La SEC exige identificar a quien consulta con un nombre y un correo
      # real, y rechaza (403) las direcciones noreply de GitHub. Se toma del
      # secreto SEC_EDGAR_USER_AGENT (Settings -> Secrets and variables ->
      # Actions -> New repository secret), por ejemplo
      # "Modelo JMR tu_correo@ejemplo.com". Como secreto no queda a la vista
      # en el repo publico ni en los logs.
      SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT || vars.SEC_EDGAR_USER_AGENT }}
    steps:
      # Al pegar el secreto es comun que quede un espacio o salto de linea al
      # final, y requests rechaza un header con esos caracteres
      # (InvalidHeader). Se normaliza a una sola linea sin espacios de mas.
      - name: Verificar identificacion para la SEC
        run: |
          ua="$(printf '%s' "$SEC_EDGAR_USER_AGENT" | tr -s '\r\n\t' '   ' | sed 's/^ *//; s/ *$//')"
          if [ -z "$ua" ]; then
            echo "::error::Falta el secreto SEC_EDGAR_USER_AGENT (nombre + correo real, p. ej. 'Modelo JMR tu_correo@ejemplo.com'). Crealo en Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "::add-mask::$ua"
          echo "SEC_EDGAR_USER_AGENT=$ua" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Traer el motor del screener (JMR-valuation)
        uses: actions/checkout@v4
        with:
          repository: JuanMaRobledo/JMR-valuation
          path: jmr-valuation

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: jmr-valuation/requirements.txt

      - run: pip install -r jmr-valuation/requirements.txt

      # Los archivos de la SEC cambian poco: se reusan hasta 7 días (el
      # propio screener decide qué volver a bajar) y la corrida tarda minutos.
      - name: Cache de SEC EDGAR
        uses: actions/cache@v4
        with:
          path: jmr-valuation/data/screener_cache
          key: sec-${{ github.run_id }}
          restore-keys: sec-

      - name: Correr el screener
        run: |
          python jmr-valuation/scripts/run_screener.py \
            --universe "${{ github.event.inputs.universe || 'sp1500' }}" \
            --max-cache-age-days 3 \
            --json-out docs/screener/resultados.json

      - name: Publicar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screener/resultados.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los resultados."
          else
            git commit -m "Screener: resultados del $(date -u +%Y-%m-%d)"
            git push
          fi
