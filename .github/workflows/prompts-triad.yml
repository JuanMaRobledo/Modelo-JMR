name: Tres prompts JMR independientes
on:
  pull_request:
    paths:
      - 'docs/prompts/valoracion-modelo-jmr-v5.md'
      - 'docs/prompts/research-fundamental-jmr-v5.md'
      - 'docs/prompts/auditoria-economica-jmr-v1.md'
      - 'tests/prompts-triad.test.mjs'
      - 'docs/prompts/colombia-valuation-v1.md'
      - 'docs/prompts/colombia-research-v1.md'
      - 'tests/work-prompt-parity.test.mjs'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'docs/CONTRATO_EJECUCION_FLOYD.md'
      - 'docs/prompts/ordenes-floyd.md'
      - 'docs/propuestas/fases/MODO_CHATGPT.md'
      - 'docs/PROCESO_UNICO_JMR.md'
      - 'tests/floyd-agent-parity.test.mjs'
      - '.github/workflows/prompts-triad.yml'
  push:
    branches: [main]
    paths:
      - 'docs/prompts/valoracion-modelo-jmr-v5.md'
      - 'docs/prompts/research-fundamental-jmr-v5.md'
      - 'docs/prompts/auditoria-economica-jmr-v1.md'
      - 'tests/prompts-triad.test.mjs'
      - 'docs/prompts/colombia-valuation-v1.md'
      - 'docs/prompts/colombia-research-v1.md'
      - 'tests/work-prompt-parity.test.mjs'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'docs/CONTRATO_EJECUCION_FLOYD.md'
      - 'docs/prompts/ordenes-floyd.md'
      - 'docs/propuestas/fases/MODO_CHATGPT.md'
      - 'docs/PROCESO_UNICO_JMR.md'
      - 'tests/floyd-agent-parity.test.mjs'
      - '.github/workflows/prompts-triad.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --test tests/prompts-triad.test.mjs tests/work-prompt-parity.test.mjs tests/floyd-agent-parity.test.mjs
