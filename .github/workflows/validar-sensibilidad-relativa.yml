name: Validar matrices de multiplos en el visor
on:
  pull_request:
    paths:
      - "docs/jmr-report-sheets.js"
      - ".github/workflows/validar-sensibilidad-relativa.yml"
  push:
    branches:
      - main
    paths:
      - "docs/jmr-report-sheets.js"
permissions:
  contents: read
jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxis del visor
        run: node --check docs/jmr-report-sheets.js
